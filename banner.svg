<svg xmlns="http://www.w3.org/2000/svg" width="800" height="155" viewBox="0 0 800 155">
  <!-- bg -->
  <rect width="800" height="155" fill="#05050A" rx="12"/>

  <!-- Static I Build -->
  <text x="400" y="62"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="44" font-weight="700"
    fill="#FFFFFF" text-anchor="middle" letter-spacing="2">I Build</text>

  <!-- Subtitle / cycling phrases (right-aligned ending at x=390) -->
  
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    AI SaaS Products
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0;0.00833;0.15;0.16667;1"
      dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    LLM Product Features
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.16667;0.175;0.31667;0.33333;1"
      dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    Workflow Automation
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.33333;0.34167;0.48333;0.5;1"
      dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    Cross-Platform Apps
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.5;0.50833;0.65;0.66667;1"
      dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    Production Backends
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.66667;0.675;0.81667;0.83333;1"
      dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="390" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="700"
    fill="#A78BFA" text-anchor="end" opacity="0">
    Codebase Rescue &amp; Audit
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.83333;0.84167;0.98333;1;1"
      dur="24s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking cursor at x=395 (just after phrase end) -->
  <text x="395" y="112"
    font-family="Sora,Inter,system-ui,sans-serif" font-size="34" font-weight="300"
    fill="#10B981" text-anchor="start">|<animate attributeName="opacity"
      values="1;1;0;0" keyTimes="0;0.5;0.51;1"
      dur="0.9s" repeatCount="indefinite"/>
  </text>
</svg>
