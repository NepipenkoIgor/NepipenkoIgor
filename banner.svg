<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050A"/>
      <stop offset="50%" style="stop-color:#0D0520"/>
      <stop offset="100%" style="stop-color:#05050A"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="55%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#05050A;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#6020D9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#05050A;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>
  <rect width="900" height="200" fill="url(#glowLeft)"/>
  <rect width="900" height="200" fill="url(#glowRight)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#8B5CF6" stroke-width="0.5">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
  </g>

  <!-- Top status pill -->
  <rect x="320" y="14" width="260" height="22" rx="11" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <circle cx="332" cy="25" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="342" y="29" fill="#C4C4D8" font-family="system-ui,sans-serif" font-size="11" letter-spacing="0.5">New project slots open · 2–4 weeks</text>

  <!-- Static headline: "I Build" -->
  <text x="450" y="90" fill="#F4F4F8" font-family="system-ui,sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="-0.5">I Build</text>

  <!-- Typewriter phrases — cycling opacity -->
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    AI SaaS Product Development
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.050;0.117;0.167;1" dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    LLM Product Features
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.217;0.283;0.333;1" dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    Workflow Automation
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.383;0.450;0.500;1" dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    Cross-Platform Apps
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.550;0.617;0.667;1" dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    Production Backends
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.717;0.783;0.833;1" dur="24s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="132" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="28" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">
    Codebase Rescue &amp; Audit
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.883;0.950;1.000;1" dur="24s" repeatCount="indefinite"/>
  </text>

  <!-- Static subline -->
  <text x="450" y="158" fill="url(#textGrad)" font-family="system-ui,sans-serif" font-size="30" font-weight="800" font-style="italic" text-anchor="middle" filter="url(#glow)">That Actually Ship</text>

  <!-- Stats row -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="100" y="188" fill="#A78BFA" font-size="13" font-weight="700">100%</text>
    <text x="100" y="198" fill="#6B6B80" font-size="9" letter-spacing="1">JOB SUCCESS</text>
    <line x1="180" y1="182" x2="180" y2="198" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
    <text x="260" y="188" fill="#A78BFA" font-size="13" font-weight="700">22+</text>
    <text x="260" y="198" fill="#6B6B80" font-size="9" letter-spacing="1">SHIPPED PRODUCTS</text>
    <line x1="340" y1="182" x2="340" y2="198" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
    <text x="450" y="188" fill="#10B981" font-size="13" font-weight="700">$2M+</text>
    <text x="450" y="198" fill="#6B6B80" font-size="9" letter-spacing="1">PROCESSED / MONTH</text>
    <line x1="560" y1="182" x2="560" y2="198" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
    <text x="650" y="188" fill="#A78BFA" font-size="13" font-weight="700">12+</text>
    <text x="650" y="198" fill="#6B6B80" font-size="9" letter-spacing="1">YEARS EXPERIENCE</text>
    <line x1="740" y1="182" x2="740" y2="198" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4"/>
    <text x="820" y="188" fill="#A78BFA" font-size="13" font-weight="700">2M+</text>
    <text x="820" y="198" fill="#6B6B80" font-size="9" letter-spacing="1">NPM DOWNLOADS</text>
  </g>
</svg>
